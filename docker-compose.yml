services:
  db:
    image: mariadb:11.4
    container_name: project-planner-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-project-planner-root}
      MARIADB_DATABASE: project_planner_auth
      MARIADB_USER: ${DB_USER:-project_planner}
      MARIADB_PASSWORD: ${DB_PASSWORD:-project-planner-password}
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - project_planner_db:/var/lib/mysql
      - ./server/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$${MARIADB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: project-planner-api
    restart: unless-stopped
    environment:
      PORT: 3001
      CLIENT_URL: http://localhost:5173
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: project_planner_auth
      DB_USER: ${DB_USER:-project_planner}
      DB_PASSWORD: ${DB_PASSWORD:-project-planner-password}
      SESSION_SECRET: ${SESSION_SECRET:-project-planner-development-secret}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:3001/api
    container_name: project-planner-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  project_planner_db: